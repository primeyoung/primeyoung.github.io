<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>想和你说的话 ✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "PingFang SC", "Microsoft Yahei", sans-serif;
            /* 替换为清新蓝白渐变，去掉甜腻粉色 */
            background: linear-gradient(120deg, #e0f7fa 0%, #f5fafe 99%, #f5fafe 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }
        /* 爱心调整为浅蓝，降低饱和度 */
        .heart-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #64b5f6;
            transform: rotate(45deg);
            animation: float 3s ease-in-out infinite;
            opacity: 0;
        }
        .heart::before, .heart::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: #64b5f6;
            border-radius: 50%;
        }
        .heart::before {
            top: -10px;
            left: 0;
        }
        .heart::after {
            top: 0;
            left: -10px;
        }
        /* 主卡片改为简约白，弱化阴影 */
        .card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(100, 181, 246, 0.1);
            z-index: 2;
            max-width: 380px;
            width: 100%;
        }
        .title {
            font-size: 22px;
            color: #263238;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .content {
            font-size: 17px;
            color: #455a64;
            line-height: 1.7;
            margin-bottom: 30px;
        }
        /* 按钮组调整配色，更简约 */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .btn {
            padding: 12px 30px;
            border-radius: 50px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-yes {
            background: #64b5f6;
            color: white;
        }
        .btn-yes:hover {
            background: #42a5f5;
            transform: scale(1.05);
        }
        .btn-no {
            background: #f5f5f5;
            color: #757575;
            position: relative;
        }
        /* 弹窗样式同步调整 */
        .popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .popup-content {
            background: white;
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            max-width: 320px;
            width: 90%;
        }
        .popup-title {
            font-size: 20px;
            color: #263238;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .popup-text {
            font-size: 17px;
            margin-bottom: 25px;
            color: #455a64;
        }
        .popup-btn {
            background: #64b5f6;
            color: white;
            padding: 10px 25px;
            border-radius: 50px;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }
        @keyframes float {
            0% {
                transform: rotate(45deg) translateY(100px);
                opacity: 0;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: rotate(45deg) translateY(-100vh);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="heart-container" id="heartContainer"></div>
    
    <div class="card">
        <h1 class="title">✨ 想和你说的话 ✨</h1>
        <p class="content" id="confessionText">
            认识你的这段日子很开心<br>
            希望往后的路，能和你一起走<br>
            你愿意吗？
        </p>
        <div class="btn-group">
            <button class="btn btn-yes" id="yesBtn">愿意 ✨</button>
            <button class="btn btn-no" id="noBtn">再想想 🤔</button>
        </div>
    </div>

    <div class="popup" id="successPopup">
        <div class="popup-content">
            <h2 class="popup-title">🌟 很高兴你愿意 🌟</h2>
            <p class="popup-text">
                愿我们一起，把平凡的日子<br>
                过得温柔又有趣
            </p>
            <button class="popup-btn" id="closePopup">好～</button>
        </div>
    </div>

    <!-- 替换为轻音乐，更贴合简约风格 -->
    <audio id="music" src="https://music.163.com/song/media/outer/url?id=1393597546.mp3" loop></audio>

    <script>
        // 爱心动画逻辑不变
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            const left = Math.random() * 100;
            const size = Math.random() * 10 + 10;
            const duration = Math.random() * 3 + 2;
            const opacity = Math.random() * 0.5 + 0.5;
            
            heart.style.left = `${left}%`;
            heart.style.bottom = '-20px';
            heart.style.width = `${size}px`;
            heart.style.height = `${size}px`;
            heart.style.animationDuration = `${duration}s`;
            heart.style.opacity = opacity;
            
            document.getElementById('heartContainer').appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        setInterval(createHeart, 300);

        // 互动逻辑不变，仅文案适配
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const successPopup = document.getElementById('successPopup');
        const closePopup = document.getElementById('closePopup');
        const music = document.getElementById('music');

        yesBtn.addEventListener('click', () => {
            music.play();
            successPopup.style.display = 'flex';
        });

        closePopup.addEventListener('click', () => {
            successPopup.style.display = 'none';
        });

        noBtn.addEventListener('mouseenter', moveNoBtn);
        noBtn.addEventListener('touchstart', moveNoBtn);

        function moveNoBtn() {
            const parent = noBtn.parentElement;
            const parentRect = parent.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();
            
            const maxLeft = parentRect.width - btnRect.width - 20;
            const maxTop = parentRect.height - btnRect.height - 20;
            
            const randomLeft = Math.random() * maxLeft;
            const randomTop = Math.random() * maxTop;
            
            noBtn.style.position = 'absolute';
            noBtn.style.left = `${randomLeft}px`;
            noBtn.style.top = `${randomTop}px`;
        }

        // 微信适配逻辑不变
        document.addEventListener('touchmove', (e) => {
            if (e.scale !== 1) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
